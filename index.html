<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fradesign — Designer remota para empresas e agências</title>

  <meta
    name="description"
    content="Apoio remoto de design para empresas, agências e equipas de marketing, disponível em português e inglês."
  >
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#1f6f5c">

  <link rel="canonical" href="https://fradesigns.com.br/">
  <link rel="alternate" hreflang="pt-PT" href="https://fradesigns.com.br/pt.html">
  <link rel="alternate" hreflang="en" href="https://fradesigns.com.br/en.html">
  <link rel="alternate" hreflang="x-default" href="https://fradesigns.com.br/pt.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Fradesign — Apoio remoto de design">
  <meta
    property="og:description"
    content="Designer remota para empresas, agências e equipas de marketing."
  >
  <meta property="og:url" content="https://fradesigns.com.br/">

  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <script>
    (() => {
      const supportedLanguages = {
        pt: "pt.html",
        en: "en.html"
      };

      const savedLanguage = localStorage.getItem("fradesign-language");

      if (savedLanguage && supportedLanguages[savedLanguage]) {
        window.location.replace(supportedLanguages[savedLanguage]);
        return;
      }

      const browserLanguage = (
        navigator.language ||
        navigator.userLanguage ||
        "pt"
      ).toLowerCase();

      const language = browserLanguage.startsWith("en") ? "en" : "pt";

      window.location.replace(supportedLanguages[language]);
    })();
  </script>

  <noscript>
    <meta http-equiv="refresh" content="0; url=pt.html">
  </noscript>

  <style>
    :root {
      color-scheme: light;
      --background: #fafaf8;
      --surface: #ffffff;
      --text: #15151b;
      --muted: #5d5d66;
      --border: #e8e6e1;
      --accent: #1f6f5c;
      --accent-hover: #185847;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    main {
      width: min(100%, 520px);
      padding: 40px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.6;
    }

    .language-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 12px 18px;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease;
    }

    a:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    a.secondary {
      color: var(--text);
      background: transparent;
      border-color: var(--border);
    }

    a.secondary:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    a:focus-visible {
      outline: 3px solid rgba(31, 111, 92, 0.35);
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Fradesign</h1>

    <p>
      Estamos a encaminhá-lo para a versão mais adequada do site.
      Se preferir, selecione o idioma manualmente.
    </p>

    <div class="language-options">
      <a
        href="pt.html"
        lang="pt-PT"
        onclick="localStorage.setItem('fradesign-language', 'pt')"
      >
        Português
      </a>

      <a
        href="en.html"
        lang="en"
        class="secondary"
        onclick="localStorage.setItem('fradesign-language', 'en')"
      >
        English
      </a>
    </div>
  </main>
</body>
</html>
